name: Tests

# Unit tests on every pull request, and on pushes to main that touch the apps. Releases run them
# again (release.yml) before anything is published. Pull requests run them whatever they touch:
# main requires the windows and android checks to pass, and a check that never runs never passes.

on:
  push:
    branches: [main]
    paths: ["windows/**", "android/**", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test windows/tests/AirLens.Core.Tests -c Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
